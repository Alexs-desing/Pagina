<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Currículum | Desarrolladora de software</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cv">
    <header class="cv-top">
      <h1 id="nombre"></h1>
      <p id="titulo" class="titulo"></p>
    </header>

    <aside class="cv-side">
      <img id="foto" class="foto" src="foto.png" alt="Foto de perfil">
      <section>
        <h2 class="pill">Acerca de mí</h2>
        <p id="acerca"></p>
      </section>
      <section>
        <h2 class="pill">Contacto</h2>
        <ul id="contacto"></ul>
      </section>
      <section>
        <h2 class="pill">Educación</h2>
        <ul id="educacion"></ul>
      </section>
      <section>
        <h2 class="pill">Experiencia laboral</h2>
        <ul id="experiencia"></ul>
      </section>
    </aside>

    <div class="cv-main">
      <section>
        <h2 class="pill">Información personal</h2>
        <ul id="personal"></ul>
      </section>
      <section>
        <h2 class="pill">Objetivo profesional</h2>
        <p id="objetivo"></p>
      </section>
      <section>
        <h2 class="pill">Habilidades técnicas</h2>
        <ul id="tecnicas" class="chips"></ul>
      </section>
      <section>
        <h2 class="pill">Habilidades personales</h2>
        <ul id="blandas"></ul>
      </section>
      <section>
        <h2 class="pill">Proyectos</h2>
        <ul id="proyectos"></ul>
      </section>
    </div>
  </main>

  <button id="imprimir" class="imprimir" type="button">Descargar PDF</button>
  <script src="script.js"></script>
</body>
</html>
